# ESPhome configuration for the ENVIRO-B2 ESP32 board (v1.6.0).
#
# Targets ESPHome 2026.9.0; validate before upgrading to a newer release.
#   - ESP32 revision v3.1 (confirmed by device logs on 2026-09-16)
#   - Features: WiFi, BT, Dual Core, Coding Scheme None
#   - 40MHz crystal
#   - 4MB flash

# ┌───────────────────────────────────────────────┐
# │         GPIO Pin Assignment Table             │
# ├─────────────┬─────────────────────────────────┤
# │ GPIO Number │ Function                        │
# ├─────────────┼─────────────────────────────────┤
# │ GPIO26       │ DHT22 Data                      │
# │ GPIO21       │ I²C SDA (OLED Display)          │
# │ GPIO22       │ I²C SCL (OLED Display)          │
# │ GPIO2       │ Status LED (optional - Internal)│
# └─────────────┴─────────────────────────────────┘
#
# Notes:
# - OLED uses SSD1306 128x32 over I²C at address 0x3C
# - DHT22 sensor reports temperature and humidity
# - WiFi signal strength is reported via ESP internal sensor

substitutions:
  # Calibration offsets applied to the DHT22 readings
  temperature_calibration: "0.0"
  humidity_calibration: "0.0"
  # Measurement intervals in seconds (plain numbers; append "s" where a time value is needed)
  update_interval_s: "30"
  update_interval_wifi: "60"

globals:
  # Persisted settings remain authoritative to preserve existing device values.
  - id: g_temperature_calibration
    type: float
    restore_value: true
    initial_value: "${temperature_calibration}"
  - id: g_humidity_calibration
    type: float
    restore_value: true
    initial_value: "${humidity_calibration}"
  - id: g_update_interval_s
    type: int
    restore_value: true
    initial_value: "${update_interval_s}"
  - id: g_update_interval_wifi
    type: int
    restore_value: true
    initial_value: "${update_interval_wifi}"
  - id: g_wifi_connected
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_last_temperature_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: g_last_humidity_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

esphome:
  name: "enviro-b2"
  friendly_name: ENVIRO-B2
  min_version: 2026.9.0
  includes:
    - enviro_helpers.h
  on_boot:
    priority: -100
    then:
      # Globals restore before this hook. Numbers are UI mirrors, not a second store.
      - lambda: |-
          id(g_update_interval_s) = enviro::valid_interval(id(g_update_interval_s), ${update_interval_s});
          id(g_update_interval_wifi) = enviro::valid_interval(id(g_update_interval_wifi), ${update_interval_wifi});
          id(temperature_calibration_number).publish_state(id(g_temperature_calibration));
          id(humidity_calibration_number).publish_state(id(g_humidity_calibration));
          id(update_interval_seconds_number).publish_state(id(g_update_interval_s));
          id(update_interval_wifi_seconds_number).publish_state(id(g_update_interval_wifi));
      - script.execute: apply_sensor_intervals
      - script.execute: redraw_display

esp32:
  variant: esp32
  framework:
    type: esp-idf
    version: recommended # Options: recommended, dev, or latest
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true # Bootloader support confirmed in device logs

# Enable operational logging. UART output is disabled because the serial port
# is not used in normal operation.
logger:
  level: INFO # VERBOSE is for short-term diagnosis only
  baud_rate: 0 # disable UART logging by default

# Enable the Home Assistant API with encrypted communication
api:
  id: native_api
  reboot_timeout: 0s # Keep measuring while Home Assistant is unavailable
  encryption:
    key: !secret enviro_b2_api_key

# Over-the-air update credentials
ota:
  - platform: esphome
    password: !secret enviro_b2_ota_pwd

wifi:
  # Wi-Fi credentials
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  output_power: 15.5dB
  # Static network configuration
  manual_ip:
    static_ip: 10.100.50.77
    gateway: 10.100.50.1
    subnet: 255.255.255.0
    dns1: 8.8.8.8
    dns2: 8.8.4.4
  reboot_timeout: 15min # Native recovery; does not reboot while fallback AP is active
  # Connection changes update the LED state and OLED immediately.
  on_connect:
    then:
      - lambda: 'id(g_wifi_connected) = true;'
      - component.update: wifi_signal_dbm # get an RSSI reading right away
      - component.update: enviro_oled     # redraw now
      - logger.log:
          level: INFO
          format: "WiFi connected"

  # Allow native reconnection and fallback AP recovery without a pending reboot.
  on_disconnect:
    then:
      - lambda: 'id(g_wifi_connected) = false;'
      - component.update: enviro_oled     # hide icon immediately
      - logger.log:
          level: WARN
          format: "WiFi disconnected; reconnecting with fallback AP recovery available"

  # Fallback access point settings
  ap:
    ssid: !secret enviro_b2_ap_sid
    password: !secret enviro_b2_ap_pwd
    ap_timeout: 90s

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: false
  frequency: 400kHz

font:
  - file: "Roboto-Regular.ttf"
    id: oled_font_small
    size: 10

# Keep the font and image beside this YAML when copying to Device Builder.
image:
  - platform: file
    file: "wifi.png"
    id: img_wifi
    resize: 19x16
    type: BINARY

display:
  - platform: ssd1306_i2c
    id: enviro_oled
    model: "SSD1306 128x32"
    address: 0x3C
    update_interval: 5s # Freshness housekeeping; data changes also trigger immediate redraws
    lambda: |-
      it.fill(Color::BLACK);

      if (enviro::fresh(millis(), id(g_last_temperature_ms), id(temp).has_state() && std::isfinite(id(temp).state), id(g_update_interval_s))) {
        const float temp_f = id(temp).state * 1.8f + 32.0f;
        it.printf(0, 0, id(oled_font_small), "Temp: %.1f°F", temp_f);
      } else {
        it.print(0, 0, id(oled_font_small), "Temp: --°F");
      }

      if (enviro::fresh(millis(), id(g_last_humidity_ms), id(humidity).has_state() && std::isfinite(id(humidity).state), id(g_update_interval_s))) {
        it.printf(0, 11, id(oled_font_small), "Humidity: %.1f%%", id(humidity).state);
      } else {
        it.print(0, 11, id(oled_font_small), "Humidity: --%");
      }

      if (id(g_wifi_connected) && id(wifi_signal_dbm).has_state() && std::isfinite(id(wifi_signal_dbm).state)) {
        it.printf(0, 22, id(oled_font_small), "WiFi: %.0f dBm", id(wifi_signal_dbm).state);
      } else {
        it.print(0, 22, id(oled_font_small), "WiFi: -- dBm");
      }

      // Only show the Wi-Fi icon when connected
      if (id(g_wifi_connected)) {
        // center vertically: (32-16)/2 = 8; right-align: 128-19-3 = 106 (3px margin)
        it.image(106, 8, id(img_wifi), COLOR_ON);
      }
      // else: do not show the icon when not connected


captive_portal: # Browser-based network recovery while fallback AP is active

sensor:
  # Report Wi-Fi signal strength
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_dbm
    update_interval: never # Started with the restored interval in on_boot
    entity_category: diagnostic
    on_value:
      - script.execute: redraw_display
    device_class: signal_strength

  # Temperature and humidity from a DHT22 sensor
  - platform: dht
    id: dht22_component
    pin: 
      number: GPIO26
      mode: INPUT_PULLUP        # helps if your external pull-up is marginal
    model: DHT22
    temperature:
      name: "DHT22 Temperature"
      id: temp
      accuracy_decimals: 1
      on_value:
        then:
          - lambda: 'id(g_last_temperature_ms) = millis();'
          - script.execute: redraw_display
      filters:
        # Invalid input is rejected; it must not reset the freshness clock.
        - lambda: |-
            if (!enviro::valid_sample(x, -40.0f, 80.0f)) return {};
            return x;
        - median:
            window_size: 5
            send_every: 1
            send_first_at: 1
        - lambda: |-
            return x + id(g_temperature_calibration);
    humidity:
      name: "DHT22 Humidity"
      id: humidity
      accuracy_decimals: 1
      on_value:
        then:
          - lambda: 'id(g_last_humidity_ms) = millis();'
          - script.execute: redraw_display
      filters:
        # Invalid input is rejected; it must not reset the freshness clock.
        - lambda: |-
            if (!enviro::valid_sample(x, 0.0f, 100.0f)) return {};
            return x;
        - median:
            window_size: 5
            send_every: 1
            send_first_at: 1
        - lambda: |-
            return enviro::calibrated_humidity(x, id(g_humidity_calibration));
    update_interval: never # Started by apply_sensor_intervals after restoration

  # How long the device has been running
  - platform: uptime
    id: enviro_b2_uptime_sensor
    name: "ENVIRO-B2 Uptime"
    entity_category: diagnostic

# Native pollers handle sampling. Scripts coordinate manual refresh and OLED redraw.
script:
  # WiFi connected but no HA: 3 long - 1 fast - 3 long blink pattern
  - id: led_no_ha_pattern
    mode: single
    then:
      - repeat:
          count: 3
          then:
            - switch.turn_on: onboard_led
            - delay: 600ms
            - switch.turn_off: onboard_led
            - delay: 200ms
      - switch.turn_on: onboard_led
      - delay: 150ms
      - switch.turn_off: onboard_led
      - delay: 200ms
      - repeat:
          count: 3
          then:
            - switch.turn_on: onboard_led
            - delay: 600ms
            - switch.turn_off: onboard_led
            - delay: 200ms
      - delay: 1000ms

  - id: redraw_display
    mode: restart
    then:
      - delay: 50ms # Coalesce the DHT temperature/humidity publications
      - component.update: enviro_oled

  - id: apply_sensor_intervals
    mode: single
    then:
      # Native pollers randomize their first firing. Apply DHT changes through
      # the guarded refresh so rapid interval edits cannot cause rapid reads.
      - script.execute: refresh_dht
      - component.resume:
          id: wifi_signal_dbm
          update_interval: !lambda 'return uint32_t(id(g_update_interval_wifi)) * 1000U;'

  - id: refresh_dht
    mode: single # Ignore repeated requests during the sensor cooldown
    then:
      - component.suspend: dht22_component
      - delay: 2s # Separate manual sampling from a preceding automatic sample
      - component.update: dht22_component
      - delay: 2s
      - component.resume:
          id: dht22_component
          update_interval: !lambda 'return uint32_t(id(g_update_interval_s)) * 1000U;'

interval:
  # LED handling only; native pollers now own sensor scheduling.
  - interval: 1s
    then:
      - lambda: |-
          if (!id(g_wifi_connected)) {
            // No WiFi: stop pattern script, simple 1s blink
            id(led_no_ha_pattern).stop();
            static bool blink_state = false;
            blink_state = !blink_state;
            if (blink_state) {
              if (!id(onboard_led).state) id(onboard_led).turn_on();
            } else {
              if (id(onboard_led).state) id(onboard_led).turn_off();
            }
          } else if (!id(connection_status).state) {
            // WiFi up, no HA client: run 3-long 1-fast 3-long pattern
            if (!id(led_no_ha_pattern).is_running()) {
              id(led_no_ha_pattern).execute();
            }
          } else {
            // Fully connected: LED off
            id(led_no_ha_pattern).stop();
            if (id(onboard_led).state) id(onboard_led).turn_off();
          }


binary_sensor:
  - platform: template
    name: "DHT Readings Stale"
    id: dht_readings_stale
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      const uint32_t now = millis();
      return !enviro::fresh(now, id(g_last_temperature_ms), id(temp).has_state() && std::isfinite(id(temp).state), id(g_update_interval_s)) ||
             !enviro::fresh(now, id(g_last_humidity_ms), id(humidity).has_state() && std::isfinite(id(humidity).state), id(g_update_interval_s));
    on_state:
      - script.execute: redraw_display

  # Show if the device is online
  - platform: template
    name: "Connection Status"
    id: connection_status
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(g_wifi_connected) && id(native_api).is_connected_with_state_subscription();

switch:
  # Controls the onboard LED connected to GPIO2
  - platform: gpio
    internal: true # The scheduler owns this LED; do not expose a competing control
    pin: GPIO2
    id: onboard_led
    inverted: false # Adjust if LED logic is inverted
    restore_mode: ALWAYS_OFF # the 1s scheduler owns this LED; start dark after boot
    entity_category: diagnostic

button:
  - platform: restart
    name: "Reboot_ENVIRO-B2"
    id: reboot_enviro_b2_restart
    entity_category: config

  - platform: template
    name: "Refresh Sensors"
    id: refresh_sensors
    on_press:
      - script.execute: refresh_dht
      - if:
          condition:
            wifi.connected:
          then:
            - component.update: wifi_signal_dbm
      - component.update: enviro_b2_uptime_sensor
      - script.execute: redraw_display

number:
  - platform: template
    name: "Temperature Calibration"
    id: temperature_calibration_number
    unit_of_measurement: "°C"
    entity_category: config
    mode: box
    optimistic: true
    min_value: -10
    max_value: 10
    step: 0.1
    restore_value: false # The matching global is the only persisted value
    initial_value: ${temperature_calibration}
    set_action:
      - globals.set:
          id: g_temperature_calibration
          value: !lambda 'return x;'
      - button.press: refresh_sensors

  - platform: template
    name: "Humidity Calibration"
    id: humidity_calibration_number
    unit_of_measurement: "%"
    entity_category: config
    mode: box
    optimistic: true
    min_value: -10
    max_value: 10
    step: 0.1
    restore_value: false # The matching global is the only persisted value
    initial_value: ${humidity_calibration}
    set_action:
      - globals.set:
          id: g_humidity_calibration
          value: !lambda 'return x;'
      - button.press: refresh_sensors

  - platform: template
    name: "Update Interval (s)"
    id: update_interval_seconds_number
    unit_of_measurement: "s"
    entity_category: config
    mode: box
    optimistic: true
    min_value: 10
    max_value: 3600
    step: 1
    restore_value: false # The matching global is the only persisted value
    initial_value: ${update_interval_s}
    set_action:
      - globals.set:
          id: g_update_interval_s
          value: !lambda 'return (int)x;'
      - script.execute: apply_sensor_intervals
      - script.execute: redraw_display

  - platform: template
    name: "WiFi Update Interval (s)"
    id: update_interval_wifi_seconds_number
    unit_of_measurement: "s"
    entity_category: config
    mode: box
    optimistic: true
    min_value: 10
    max_value: 3600
    step: 1
    restore_value: false # The matching global is the only persisted value
    initial_value: ${update_interval_wifi}
    set_action:
      - globals.set:
          id: g_update_interval_wifi
          value: !lambda 'return (int)x;'
      - script.execute: apply_sensor_intervals
      - script.execute: redraw_display
