name: Firmware validation
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install esphome==2026.9.0
      - run: python scripts/validate_config.py
